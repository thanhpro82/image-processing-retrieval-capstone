name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install data-free processing test dependency
        run: python -m pip install Pillow==12.3.0
      - name: Compile Python sources
        run: python -m compileall -q app scripts
      - name: Test query handling
        run: python -m unittest discover -s tests -v
      - name: Build data-free demo image
        run: docker build -t image-processing-capstone:ci .
